# Zones de limitation JEETCHECK.
#
# MESURE le 27/08/2026 : UN appel a /api/check coute 6 a 7 appels GMGN, sur le
# quota de Louis, dont le plafond mensuel n'est pas connu. Avant ce jour,
# /api/check tombait dans `location /` a 120 r/min, soit ~720 appels GMGN par
# minute depuis une seule IP. La protection etait posee sur /api/analyze, que la
# page n'appelle plus. La serrure etait sur la mauvaise porte.
#
# Deux verrous, parce qu'une limite par IP ne protege pas d'un afflux reparti :
#   jeet_check      par IP, pour l'abus individuel
#   jeet_check_all  global (cle constante), pour le total, quel que soit le
#                   nombre d'IP. 30 r/min x 7 appels = ~210 appels GMGN/min au
#                   pire, ce qui reste chiffrable contre un quota inconnu.
limit_req_zone $binary_remote_addr zone=jeet_check:10m     rate=10r/m;
limit_req_zone $server_name        zone=jeet_check_all:1m  rate=30r/m;

# L'ancien scan de wallet complet. Conserve au cas ou il serait re-expose, mais
# il n'est plus route (voir le 404 dans le site) : il ouvre un budget de 150 s
# et peut faire des centaines d'appels par requete.
limit_req_zone $binary_remote_addr zone=jeet_analyze:10m rate=6r/m;

# Pages, logos, statique : ne coutent rien, limite large.
limit_req_zone $binary_remote_addr zone=jeet_pages:10m rate=120r/m;

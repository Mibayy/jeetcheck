# JEETCHECK. Le service node ecoute en local sur 8932 et sert la page + l'API.
# TLS pose par certbot.

server {
    server_name jeetcheck.<YOUR-IP>.sslip.io;

    client_max_body_size 1m;

    # En-tetes de securite. Il n'y en avait aucun avant le 27/08/2026.
    # `always` pour qu'ils sortent aussi sur les 4xx/5xx, pas seulement sur 200.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # La page est un fichier unique : un <script> et un <style> en ligne, plus
    # Google Fonts. 'unsafe-inline' est donc requis et assume ; en echange rien
    # ne peut etre charge d'ailleurs, et img-src couvre les logos de tokens,
    # servis soit par le relais local /api/logo soit par leur hote d'origine.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # LE produit. Mesure le 27/08/2026 : 6 a 7 appels GMGN par requete, sur un
    # quota dont le plafond mensuel n'est pas connu. Deux verrous, par IP et
    # global : une limite par IP seule ne protege pas d'un afflux reparti.
    # `nodelay` sur le premier pour qu'un visiteur normal ne subisse aucune
    # attente ; pas de `nodelay` sur le global, qui met en file plutot que de
    # refuser.
    location /api/check {
        limit_req zone=jeet_check burst=5 nodelay;
        limit_req zone=jeet_check_all burst=30;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8932;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un check a froid tient en ~3 s, mais le budget serveur va jusqu'a 90 s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # L'ancien scan de wallet complet, retire de la surface publique le
    # 27/08/2026 avant distribution. La page ne l'appelle plus, il ouvre un
    # budget de 150 s et peut faire des centaines d'appels GMGN par requete.
    # Le code reste en place : pour le re-exposer, remplacer ces deux blocs par
    # un proxy_pass avec `limit_req zone=jeet_analyze burst=3 nodelay;`.
    location = /api/analyze { return 404; }
    location = /scan.html   { return 404; }

    location / {
        limit_req zone=jeet_pages burst=40 nodelay;
        proxy_pass http://127.0.0.1:8932;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jeetcheck.<YOUR-IP>.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jeetcheck.<YOUR-IP>.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = jeetcheck.<YOUR-IP>.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name jeetcheck.<YOUR-IP>.sslip.io;
    return 404; # managed by Certbot


}

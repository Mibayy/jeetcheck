# JEETCHECK. The node service listens locally on 8932 and serves the page + API.
# TLS set up by certbot afterwards:
#   certbot --nginx -d jeetcheck.<YOUR-IP>.sslip.io

server {
    server_name jeetcheck.<YOUR-IP>.sslip.io;

    client_max_body_size 1m;

    # A cold analysis takes ~90 s. A short timeout would cut it off
    # mid-calculation and return a 504 while everything is going fine.
    location /api/analyze {
        limit_req zone=jeet_analyze burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8932;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_req zone=jeet_pages burst=40 nodelay;
        proxy_pass http://127.0.0.1:8932;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jeetcheck.<YOUR-IP>.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jeetcheck.<YOUR-IP>.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = jeetcheck.<YOUR-IP>.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name jeetcheck.<YOUR-IP>.sslip.io;
    return 404; # managed by Certbot


}
# Each cold analysis consumes ~30 GeckoTerminal calls and ~58 GMGN calls,
# both on shared quotas. A burst from a single IP would exhaust the quota for
# everyone, hence a tight limit on the analysis itself. Pages and logos cost
# nothing: they keep a wide limit.
limit_req_zone $binary_remote_addr zone=jeet_analyze:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=jeet_pages:10m rate=120r/m;
